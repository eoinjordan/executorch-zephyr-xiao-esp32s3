# Extra config for the brick detector on xiao_esp32s3/esp32s3/procpu/sense
# with the round display:
#   west build -b xiao_esp32s3/esp32s3/procpu/sense --shield seeed_xiao_round_display firmware -- \
#     -DEXTRA_CONF_FILE="camera.conf;display.conf;lego.conf" \
#     -DEXTRA_DTC_OVERLAY_FILE=round_display.overlay

CONFIG_APP_LEGO=y

# The 8 MB of octal PSRAM in the ESP32-S3R8. The fp32 program works there;
# the int8 program, the camera and the screen stay in internal RAM.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=1048576

# The camera sends the high byte of each RGB565 pixel first. The digit demo
# gets away with reading it the other way round because it only wants ink
# against paper; colours need it right.
CONFIG_APP_CAMERA_SWAP_BYTES=y

# The console takes the one-character requests of tools/lego_capture.py.
CONFIG_SERIAL=y
