# ExecuTorch runtime (modules/lib/executorch, zephyr/Kconfig)
CONFIG_EXECUTORCH=y
# Only link the operators present in the .pte (selective build in CMakeLists)
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n
CONFIG_EXECUTORCH_ENABLE_LOGGING=y

# C++17 with full libstdc++ (ExecuTorch requires it)
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Stack and heap. The runtime uses our static pools for tensors, but Program
# parsing and std::vector in main() need some heap.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Hardware float on the Xtensa LX7 FPU
CONFIG_FPU=y

# Print floats in logits
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_PRINTK=y

# Pool sizes (see Kconfig). The firmware prints how much of each is used.
CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=73728
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=8192
CONFIG_APP_CMSIS_NN_METHOD_POOL_SIZE=32768
CONFIG_APP_CMSIS_NN_TEMP_POOL_SIZE=16384

# Optimise for speed: this is an inference demo and the board has 8 MB of
# flash. It also keeps Windows builds working: with -Os GCC takes the
# size-optimised libstdc++ headers, whose path in the ESP32-S3 toolchain is
# longer than the 260 characters Windows allows by default.
CONFIG_SPEED_OPTIMIZATIONS=y
