# Extra config for the live-camera mode on xiao_esp32s3/esp32s3/procpu/sense:
#   west build -b xiao_esp32s3/esp32s3/procpu/sense firmware -- -DEXTRA_CONF_FILE=camera.conf

CONFIG_APP_CAMERA=y

CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Two 160x120 RGB565 frames (38400 B each) in internal SRAM, no PSRAM needed.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=81920
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=64
