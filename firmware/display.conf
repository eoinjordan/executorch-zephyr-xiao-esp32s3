# Extra config for the Seeed Studio Round Display for XIAO (GC9A01, 240 x 240):
#   west build -b xiao_esp32s3/esp32s3/procpu/sense --shield seeed_xiao_round_display firmware -- \
#     -DEXTRA_CONF_FILE="camera.conf;display.conf" -DEXTRA_DTC_OVERLAY_FILE=round_display.overlay

CONFIG_APP_SCREEN=y

CONFIG_DISPLAY=y

# With a screen to look at, classify as fast as the camera delivers.
CONFIG_APP_CAMERA_INTERVAL_MS=50
