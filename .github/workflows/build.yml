name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  train-export:
    name: Train and export (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install executorch==1.5.1 torchvision --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train (smoke) and export
        run: python train/train_mnist.py --epochs 1 --limit 10000 --pte /tmp/ci.pte --header /tmp/ci_test_input.h --state-dict /tmp/ci.pt
      - name: Run committed .pte on the host runtime
        run: python train/run_pte_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-model
          path: |
            /tmp/ci.pte
            /tmp/ci_test_input.h

  firmware:
    name: Build firmware (${{ matrix.board }}${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao_esp32s3/esp32s3/procpu
            extra: ""
          - board: xiao_esp32s3/esp32s3/procpu/sense
            extra: ""
          - board: xiao_esp32s3/esp32s3/procpu/sense
            extra: " -DEXTRA_CONF_FILE=camera.conf"
    steps:
      - uses: actions/checkout@v4
        with:
          path: executorch-zephyr-xiao-esp32s3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zephyr host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf ccache \
            dfu-util device-tree-compiler wget xz-utils file make gcc libsdl2-dev libmagic1
      - name: Python dependencies (west + ExecuTorch codegen)
        run: pip install -r executorch-zephyr-xiao-esp32s3/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: West workspace
        run: |
          west init -l executorch-zephyr-xiao-esp32s3
          west update --narrow -o=--depth=1
          west packages pip --install
          west blobs fetch hal_espressif
      - name: Zephyr SDK (ESP32-S3 toolchain only)
        run: west sdk install --toolchains xtensa-espressif_esp32s3_zephyr-elf
      - name: Build
        run: west build -p always -b ${{ matrix.board }} executorch-zephyr-xiao-esp32s3/firmware --${{ matrix.extra }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.map
